[project]
name = "dupl"
version = "0.1.1"
description = "Script for running python linters"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["mypy>=2.3.1", "ruff>=0.16.6"]

[project.scripts]
dupl = "dupl.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # think it a da job of da formatta
    "ISC001", # think it a da job of da formatta
    "CPY001", # me no likee copyright
    "D",      # i don't like docstrings
    "T201",   # it is a intended
]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_unimported = true
extra_checks = true
